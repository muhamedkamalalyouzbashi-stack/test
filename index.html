<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ai for Teacher | MVP</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f6ff;
        --card: #ffffff;
        --text: #1f2937;
        --primary: #3b82f6;
        --primary-dark: #1d4ed8;
        --border: #dbe3f0;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
        background: radial-gradient(circle at top right, #dbeafe, var(--bg));
        color: var(--text);
      }

      .app {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px;
      }

      header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 18px;
      }

      h1 { margin: 0; font-size: 1.7rem; }
      .subtitle { margin: 5px 0 0; opacity: 0.8; }

      .lang-switch {
        display: flex;
        gap: 8px;
      }

      .lang-switch button,
      .btn {
        border: 1px solid var(--border);
        background: white;
        padding: 8px 12px;
        border-radius: 10px;
        cursor: pointer;
      }

      .lang-switch button.active,
      .btn.primary {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      .grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 16px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }

      input, textarea, select {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 12px;
        font: inherit;
      }

      textarea { min-height: 120px; resize: vertical; }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .actions { display: flex; gap: 10px; flex-wrap: wrap; }

      .history-item {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 8px;
        background: #f8fbff;
      }

      .muted { opacity: 0.75; font-size: 0.9rem; }
      #status { min-height: 20px; margin-top: 10px; }
      #aiOutput { white-space: pre-wrap; }

      @media (max-width: 900px) {
        .grid { grid-template-columns: 1fr; }
        .row { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div>
          <h1 id="title">ai for Teacher</h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="lang-switch">
          <button data-lang="de" class="active">Deutsch</button>
          <button data-lang="en">English</button>
        </div>
      </header>

      <div class="grid">
        <section class="card">
          <h2 id="plannerHeading"></h2>
          <p class="muted" id="plannerHint"></p>

          <div class="row">
            <div>
              <label for="grade" id="labelGrade"></label>
              <input id="grade" placeholder="7" />
            </div>
            <div>
              <label for="subject" id="labelSubject"></label>
              <input id="subject" placeholder="Mathematik" />
            </div>
          </div>

          <label for="goal" id="labelGoal"></label>
          <textarea id="goal"></textarea>

          <label for="lang" id="labelOutputLang"></label>
          <select id="lang">
            <option value="de">Deutsch</option>
            <option value="en">English</option>
          </select>

          <div class="actions">
            <button class="btn" id="saveDraft"></button>
            <button class="btn primary" id="generateBtn"></button>
            <button class="btn" id="clearData"></button>
          </div>
          <p id="status" class="muted"></p>
        </section>

        <aside class="card">
          <h3 id="historyHeading"></h3>
          <p class="muted" id="localFirstHint"></p>
          <div id="history"></div>
        </aside>
      </div>

      <section class="card" style="margin-top: 16px;">
        <h3 id="resultHeading"></h3>
        <p class="muted" id="apiHint"></p>
        <div id="aiOutput"></div>
      </section>

      <section class="card" style="margin-top: 16px;">
        <h3 id="resourcesHeading"></h3>
        <p class="muted" id="resourcesHint"></p>
        <ul>
          <li>
            <a href="/content/genial-mathematik1-spieleideen.md" target="_blank" rel="noopener" id="resourceGames"></a>
          </li>
        </ul>
      </section>
    </div>

    <script>
      const copy = {
        de: {
          subtitle: 'Teacher-first AI Teaching Productivity Platform (MVP, local-first)',
          plannerHeading: 'Unterrichtsplan-Assistent',
          plannerHint: 'Entwürfe werden lokal im Browser gespeichert.',
          labelGrade: 'Klassenstufe',
          labelSubject: 'Fach',
          labelGoal: 'Lernziel / Kontext',
          labelOutputLang: 'Ausgabesprache',
          saveDraft: 'Entwurf lokal speichern',
          generateBtn: 'Mit KI generieren',
          clearData: 'Lokale Daten löschen',
          historyHeading: 'Zuletzt gespeicherte Entwürfe',
          localFirstHint: 'Standardmäßig verlässt kein Entwurf den Browser.',
          resultHeading: 'KI-Ergebnis',
          apiHint: 'Die KI-Anfrage läuft über /api/ai/generate, damit keine API-Keys im Frontend landen.',
          resourcesHeading: 'Unterrichtsmaterial',
          resourcesHint: 'Zusätzliche lokale Materialien für die Unterrichtsplanung.',
          resourceGames: 'Spielesammlung: Genial! Mathematik 1 (kapitelbasiert)',
          saved: 'Entwurf lokal gespeichert.',
          deleted: 'Lokale Daten gelöscht.',
          generating: 'Generiere Vorschlag…',
          failed: 'Fehler bei der KI-Anfrage.'
        },
        en: {
          subtitle: 'Teacher-first AI Teaching Productivity Platform (MVP, local-first)',
          plannerHeading: 'Lesson plan assistant',
          plannerHint: 'Drafts are stored locally in your browser.',
          labelGrade: 'Grade level',
          labelSubject: 'Subject',
          labelGoal: 'Learning objective / context',
          labelOutputLang: 'Output language',
          saveDraft: 'Save draft locally',
          generateBtn: 'Generate with AI',
          clearData: 'Delete local data',
          historyHeading: 'Recently saved drafts',
          localFirstHint: 'By default no draft leaves the browser.',
          resultHeading: 'AI output',
          apiHint: 'AI calls are proxied through /api/ai/generate so no API keys are exposed in frontend code.',
          resourcesHeading: 'Teaching resources',
          resourcesHint: 'Additional local materials to support lesson planning.',
          resourceGames: 'Game collection: Genial! Mathematik 1 (chapter-based)',
          saved: 'Draft saved locally.',
          deleted: 'Local data deleted.',
          generating: 'Generating response…',
          failed: 'AI request failed.'
        }
      };

      const elements = {
        status: document.getElementById('status'),
        history: document.getElementById('history'),
        aiOutput: document.getElementById('aiOutput'),
        grade: document.getElementById('grade'),
        subject: document.getElementById('subject'),
        goal: document.getElementById('goal'),
        lang: document.getElementById('lang')
      };

      let uiLang = localStorage.getItem('uiLang') || 'de';
      const storageKey = 'teacherDrafts:v1';

      function applyCopy() {
        const t = copy[uiLang];
        for (const id of ['subtitle','plannerHeading','plannerHint','labelGrade','labelSubject','labelGoal','labelOutputLang','saveDraft','generateBtn','clearData','historyHeading','localFirstHint','resultHeading','apiHint','resourcesHeading','resourcesHint','resourceGames']) {
          document.getElementById(id).textContent = t[id];
        }
        document.querySelectorAll('.lang-switch button').forEach(b => b.classList.toggle('active', b.dataset.lang === uiLang));
      }

      function readDrafts() {
        try { return JSON.parse(localStorage.getItem(storageKey) || '[]'); }
        catch { return []; }
      }

      function saveDrafts(drafts) {
        localStorage.setItem(storageKey, JSON.stringify(drafts.slice(0, 8)));
      }

      function renderHistory() {
        const drafts = readDrafts();
        elements.history.innerHTML = drafts.length ? '' : `<p class="muted">—</p>`;
        drafts.forEach(d => {
          const node = document.createElement('div');
          node.className = 'history-item';
          node.innerHTML = `<strong>${d.subject || '—'} (${d.grade || '—'})</strong><div class="muted">${new Date(d.savedAt).toLocaleString()}</div><div>${d.goal}</div>`;
          elements.history.appendChild(node);
        });
      }

      function persistCurrentDraft() {
        const draft = {
          grade: elements.grade.value.trim(),
          subject: elements.subject.value.trim(),
          goal: elements.goal.value.trim(),
          outputLanguage: elements.lang.value,
          savedAt: Date.now()
        };
        const drafts = readDrafts();
        drafts.unshift(draft);
        saveDrafts(drafts);
        renderHistory();
        elements.status.textContent = copy[uiLang].saved;
      }

      async function generateAI() {
        elements.status.textContent = copy[uiLang].generating;
        elements.aiOutput.textContent = '';
        const payload = {
          grade: elements.grade.value.trim(),
          subject: elements.subject.value.trim(),
          goal: elements.goal.value.trim(),
          language: elements.lang.value
        };

        try {
          const res = await fetch('/api/ai/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error('Bad response');
          const data = await res.json();
          elements.aiOutput.textContent = data.output;
          elements.status.textContent = '';
        } catch (err) {
          elements.status.textContent = copy[uiLang].failed;
        }
      }

      document.querySelectorAll('.lang-switch button').forEach(btn => {
        btn.addEventListener('click', () => {
          uiLang = btn.dataset.lang;
          localStorage.setItem('uiLang', uiLang);
          applyCopy();
        });
      });

      document.getElementById('saveDraft').addEventListener('click', persistCurrentDraft);
      document.getElementById('generateBtn').addEventListener('click', generateAI);
      document.getElementById('clearData').addEventListener('click', () => {
        localStorage.removeItem(storageKey);
        elements.aiOutput.textContent = '';
        renderHistory();
        elements.status.textContent = copy[uiLang].deleted;
      });

      applyCopy();
      renderHistory();
    </script>
  </body>
</html>
